# Alert Rules for infra-platform

groups:
  - name: infra-platform-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}%"

      - alert: ServiceDown
        expr: up{job="infra-platform"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "infra-platform is down"
